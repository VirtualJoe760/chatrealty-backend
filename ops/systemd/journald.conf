# jpsrealtor VPS — systemd-journald caps
#
# Source of truth: this file. Installed to /etc/systemd/journald.conf.
# Installed 2026-10-13.
#
# Why this exists: the shipped config was an empty [Journal] header — no
# settings at all — so journald fell back to its default cap of 10% of the
# filesystem. On a 77 GB disk that is ~7.7 GB. It had reached 1.1 GB over a
# single 175-day boot (Apr 20 → Oct 13) with no second boot to roll it.
#
# What was actually in those 1.1 GB: 1,157,638 entries from ssh.service, 83%
# of the journal. A 2,000-entry sample was 546 "Invalid user" against 1
# legitimate publickey login — internet background scanning, not our traffic.
# Nothing on this box reads the journal; the pipeline logs to local-logs/ and
# /var/log, both covered by ops/logrotate/jpsrealtor.
#
# 200M keeps roughly a month of real history for debugging a failed cron run
# while making an unbounded journal impossible. MaxRetentionSec is the second
# bound: even if volume stays low, nothing older than 30 days is kept.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemKeepFree=2G
SystemMaxFileSize=50M
MaxRetentionSec=30day
RuntimeMaxUse=50M
